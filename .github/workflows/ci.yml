name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt

      - name: Generate Python gRPC stubs
        run: bash scripts/gen_proto.sh --python-only

      - name: Run tests
        run: |
          .venv/bin/python -m unittest tests.test_paths
          .venv/bin/python tests/test_backend.py
          .venv/bin/python tests/test_server.py

  frontend:
    name: Frontend analyze & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/flutter/scribe_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 25.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate Dart gRPC stubs
        working-directory: .
        run: bash scripts/gen_proto.sh --dart-only

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
